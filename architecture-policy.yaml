version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints: [packages/services/src/session/contract.ts]
    owner: conversation
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: zcode-server-cli
    roots: [packages/zcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  - id: desktop
    roots: [packages/desktop/src]
    managed: false
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: zcode-cli
    roots: [apps/zcode-cli]
    managed: false
  - id: arena-contracts
    roots: [packages/arena-contracts/src]
    managed: true
    requires: []
    publicEntrypoints: [packages/arena-contracts/src/contract.ts]
    owner: arena-tl
  - id: arena-application
    roots: [packages/arena-application/src]
    managed: true
    requires: [arena-contracts]
    publicEntrypoints: [packages/arena-application/src/contract.ts]
    owner: arena-tl
  - id: arena-api
    roots: [packages/arena-api/src]
    managed: true
    requires: [arena-contracts, arena-application, arena-persistence, arena-ops]
    publicEntrypoints: [packages/arena-api/src/contract.ts]
    owner: arena-tl
  - id: arena-capsule
    roots: [packages/arena-capsule/src]
    managed: true
    requires: [arena-contracts]
    publicEntrypoints: [packages/arena-capsule/src/contract.ts]
    owner: arena-tl
  - id: arena-workbench
    roots: [packages/arena-workbench/src]
    managed: true
    requires: [arena-contracts]
    publicEntrypoints: [packages/arena-workbench/src/contract.ts]
    owner: arena-tl
  - id: arena-shell
    roots: [packages/arena-shell/src]
    managed: true
    requires: [arena-contracts, arena-workbench, arena-sdk, arena-ops, arena-acquisition]
    publicEntrypoints:
      [
        packages/arena-shell/src/contract.ts,
        packages/arena-shell/src/shell/ArenaShell.tsx,
        packages/arena-shell/src/screens.ts,
        packages/arena-shell/src/identity/productTitle.ts,
        packages/arena-shell/src/styles.css,
        packages/arena-shell/src/design/arena-tokens.css,
      ]
    owner: arena-tl
  - id: arena-persistence
    roots: [packages/arena-persistence/src]
    managed: true
    requires: [arena-contracts]
    publicEntrypoints: [packages/arena-persistence/src/contract.ts]
    owner: arena-tl
  - id: arena-evidence
    roots: [packages/arena-evidence/src]
    managed: true
    requires: [arena-contracts]
    publicEntrypoints: [packages/arena-evidence/src/contract.ts]
    owner: arena-tl
  - id: arena-payment
    roots: [packages/arena-payment/src]
    managed: true
    requires: [arena-contracts, arena-evidence]
    publicEntrypoints: [packages/arena-payment/src/contract.ts]
    owner: arena-tl
  - id: arena-matching
    roots: [packages/arena-matching/src]
    managed: true
    requires: [arena-contracts]
    publicEntrypoints: [packages/arena-matching/src/contract.ts]
    owner: arena-tl
  - id: arena-sdk
    roots: [packages/arena-sdk/src]
    managed: true
    requires: [arena-contracts]
    publicEntrypoints: [packages/arena-sdk/src/contract.ts]
    owner: arena-tl
  - id: arena-expert-arena
    roots: [packages/arena-expert-arena/src]
    managed: true
    requires: [arena-contracts, arena-evidence, arena-matching]
    publicEntrypoints: [packages/arena-expert-arena/src/contract.ts]
    owner: arena-tl
  - id: arena-ops
    roots: [packages/arena-ops/src]
    managed: true
    requires: [arena-contracts, arena-capsule]
    publicEntrypoints: [packages/arena-ops/src/contract.ts]
    owner: arena-tl
  - id: arena-harness
    roots: [packages/arena-harness/src]
    managed: true
    requires:
      [
        arena-contracts,
        arena-application,
        arena-persistence,
        arena-evidence,
        arena-payment,
        arena-matching,
        arena-expert-arena,
        arena-sdk,
        arena-ops,
      ]
    publicEntrypoints: [packages/arena-harness/src/contract.ts]
    owner: arena-tl
  - id: arena-learning
    roots: [packages/arena-learning/src]
    managed: true
    requires: [arena-contracts, arena-evidence]
    publicEntrypoints: [packages/arena-learning/src/contract.ts]
    owner: arena-tl
  - id: arena-acquisition
    roots: [packages/arena-acquisition/src]
    managed: true
    requires: [arena-contracts]
    publicEntrypoints: [packages/arena-acquisition/src/contract.ts]
    owner: arena-tl
  - id: arena-scraper
    roots: [packages/arena-scraper/src]
    managed: true
    requires: [arena-contracts, arena-capsule, arena-acquisition]
    publicEntrypoints: [packages/arena-scraper/src/contract.ts]
    owner: arena-tl
  - id: arena-upgrade
    roots: [packages/arena-upgrade/src]
    managed: true
    requires: [arena-contracts, arena-evidence, arena-learning, arena-acquisition, arena-scraper]
    publicEntrypoints: [packages/arena-upgrade/src/contract.ts]
    owner: arena-tl
  - id: arena-release-gate
    roots: [packages/arena-release-gate/src]
    managed: true
    requires: [arena-contracts, arena-capsule, arena-evidence, arena-sdk]
    publicEntrypoints: [packages/arena-release-gate/src/contract.ts]
    owner: arena-tl

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

exceptions: []
