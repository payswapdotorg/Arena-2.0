name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  battery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install -g pnpm@10.33.2

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc -b, 15 projects incl. arena family)
        run: pnpm typecheck

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Architecture guard
        run: pnpm architecture:check

      - name: Contract suite — arena-contracts vectors, transitions, completeness, ownership (B1-B5)
        working-directory: packages/arena-contracts
        run: ../../node_modules/.bin/tsx --test test/vectors.test.ts test/transitions.test.ts test/completeness.test.ts test/ownership.test.ts test/contracts.test.ts

      - name: Unit tests — services (node:test via tsx)
        working-directory: packages/services
        run: ../../node_modules/.bin/tsx --test test/providerConfigMigration.test.ts test/nonCliAcpRetirement.test.ts test/importedClaudeRecovery.test.ts

      - name: Unit tests — arena-application (node:test via tsx)
        working-directory: packages/arena-application
        run: ../../node_modules/.bin/tsx --test test/application.test.ts

      - name: Unit tests — arena-api (node:test via tsx)
        working-directory: packages/arena-api
        run: ../../node_modules/.bin/tsx --test test/api.test.ts test/durable.test.ts test/durable-edge.test.ts

      - name: Unit tests — arena-capsule (node:test via tsx)
        working-directory: packages/arena-capsule
        run: ../../node_modules/.bin/tsx --test test/capsule.test.ts test/synthetic-provider.test.ts

      - name: Unit tests — arena-isolation (node:test via tsx; auto-detect — typed skips when bwrap absent)
        working-directory: packages/arena-isolation
        run: ../../node_modules/.bin/tsx --test test/capability.test.ts test/conformance.test.ts test/evidence.test.ts test/provider-port.test.ts test/escape-battery.test.ts test/non-regression.test.ts

      - name: Unit tests — arena-identity (node:test via tsx; adversarial auth battery incl. JWKS rotation + replay)
        working-directory: packages/arena-identity
        run: ../../node_modules/.bin/tsx --test test/*.test.ts

      - name: Install Playwright Chromium (arena-workbench a11y suite)
        working-directory: packages/arena-workbench
        run: ../../node_modules/.bin/playwright install chromium

      - name: Unit tests — arena-workbench (node:test via tsx; incl. rendered-state a11y + keyboard journeys)
        working-directory: packages/arena-workbench
        run: ../../node_modules/.bin/tsx --test test/*.test.ts && ../../node_modules/.bin/tsx --test test/*.test.tsx

      - name: Unit tests — arena-shell (node:test via tsx; UIA-001 shell + five-screen lanes incl. REAL arena-api compositions)
        working-directory: packages/arena-shell
        run: ../../node_modules/.bin/tsx --test test/shell/*.test.ts test/shell/*.test.tsx test/identity/*.test.tsx test/nav/*.test.ts test/requester/*.test.ts test/requester/*.test.tsx test/expert/*.test.ts test/expert/*.test.tsx test/reviewer/*.test.ts test/reviewer/*.test.tsx test/developer/*.test.ts test/developer/*.test.tsx test/operations/*.test.ts test/operations/*.test.tsx test/design/*.test.ts

      - name: Unit tests — desktop renderer (node:test via tsx; UIA-002 arena-first bootstrap decision + composition incl. real local HTTP probe + shim parity)
        working-directory: packages/desktop
        run: ../../node_modules/.bin/tsx --test test/renderer/*.test.ts test/station/*.test.ts

      - name: Unit tests — arena-persistence (node:test via tsx, node:sqlite)
        working-directory: packages/arena-persistence
        run: ../../node_modules/.bin/tsx --test test/durable.test.ts test/jobs.test.ts

      - name: Unit tests — arena-evidence (node:test via tsx)
        working-directory: packages/arena-evidence
        run: ../../node_modules/.bin/tsx --test test/evidence.test.ts test/validator.test.ts test/proof-evaluator.test.ts

      - name: Unit tests — arena-payment (node:test via tsx)
        working-directory: packages/arena-payment
        run: ../../node_modules/.bin/tsx --test test/ledger.test.ts test/payment-flow.test.ts

      - name: Unit tests — arena-matching (node:test via tsx)
        working-directory: packages/arena-matching
        run: ../../node_modules/.bin/tsx --test test/matching.test.ts

      - name: Unit tests — arena-sdk (node:test via tsx; E2E spawns real arena-api + MCP facade processes)
        working-directory: packages/arena-sdk
        run: ../../node_modules/.bin/tsx --test test/sdk.test.ts test/webhook.test.ts test/mcp.test.ts test/e2e-real-integration.test.ts

      - name: Unit tests — arena-expert-arena (node:test via tsx)
        working-directory: packages/arena-expert-arena
        run: ../../node_modules/.bin/tsx --test test/machines.test.ts test/candidate.test.ts test/review-assignment.test.ts test/rubric-quorum.test.ts test/adjudication-validation.test.ts

      - name: Unit tests — arena-ops (node:test via tsx; custodian drives the real synthetic capsule provider)
        working-directory: packages/arena-ops
        run: ../../node_modules/.bin/tsx --test test/health-capacity.test.ts test/custodian.test.ts test/observability-retention.test.ts

      - name: Acceptance profiles — arena-harness (node:test via tsx; spawns REAL arena-api processes incl. two-instance + SIGKILL recovery)
        working-directory: packages/arena-harness
        run: ../../node_modules/.bin/tsx --test test/vertical-p0.test.ts test/next-expert.test.ts test/p2-review.test.ts test/two-instance-recovery.test.ts

      - name: Unit tests — arena-acquisition (node:test via tsx)
        working-directory: packages/arena-acquisition
        run: ../../node_modules/.bin/tsx --test test/*.test.ts

      - name: Unit tests — arena-scraper (node:test via tsx)
        working-directory: packages/arena-scraper
        run: ../../node_modules/.bin/tsx --test test/*.test.ts

      - name: Unit tests — arena-upgrade (node:test via tsx)
        working-directory: packages/arena-upgrade
        run: ../../node_modules/.bin/tsx --test test/*.test.ts

      - name: Unit tests — arena-learning (node:test via tsx)
        working-directory: packages/arena-learning
        run: ../../node_modules/.bin/tsx --test test/learning.test.ts

      - name: Release gate — arena-release-gate (node:test via tsx; AR2-015 adversarial profiles spawn a REAL arena-api process and a REAL HTTP webhook receiver; AR2-023 decision-instrument suite — schema vectors, determinism, class consistency, amendment chain, template parse, AR2-015 non-regression)
        working-directory: packages/arena-release-gate
        run: ../../node_modules/.bin/tsx --test test/*.test.ts

      - name: Unit tests — ui (node:test via tsx, package-local tsconfig paths)
        working-directory: packages/ui
        run: ../../node_modules/.bin/tsx --test test/nonCliAcpRetirement.test.ts
